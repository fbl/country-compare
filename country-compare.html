<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Country Wealth Compare</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f3f0; --surface: #fcfcfb; --border: #dddbd4; --grid: #e6e4de;
    --text: #0b0b0b; --text-2: #52514e; --text-3: #7b7a74;
    --accent: #2a78d6; --bar: #2a78d6; --bar-track: #eceae5; --warn: #a55a00;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111110; --surface: #1a1a19; --border: #34332f; --grid: #2a2a27;
      --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86;
      --accent: #6aa6ee; --bar: #3987e5; --bar-track: #262624; --warn: #e0a050;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; max-width: 1400px; margin: 0 auto; padding: 20px 16px 48px; }
  @media (max-width: 860px) { .app { grid-template-columns: minmax(0, 1fr); } aside { position: static !important; max-height: none !important; } }
  h1 { font-size: 20px; margin: 0 0 2px; }
  h2 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--text-2); margin: 0 0 12px; font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  aside { position: sticky; top: 12px; align-self: start; max-height: calc(100vh - 24px); overflow: auto; }
  aside .card { margin-bottom: 12px; }
  fieldset { border: 0; padding: 0; margin: 0 0 14px; }
  legend { font-weight: 600; padding: 0; margin-bottom: 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-2); }
  label.f { display: grid; grid-template-columns: 1fr 112px; align-items: center; gap: 8px; margin: 6px 0; }
  label.f:has(select) { grid-template-columns: 1fr 170px; }
  .head { display: flex; flex-direction: column-reverse; }
  .langs { display: flex; gap: 2px; justify-content: flex-end; margin: -8px -6px 0 0; }
  .langs button { all: unset; cursor: pointer; font-size: 17px; line-height: 1; padding: 4px 3px; border-radius: 5px; opacity: .45; }
  .langs button:hover { opacity: .8; }
  .langs button[aria-pressed=true] { opacity: 1; background: var(--bar-track); }
  .langs button:focus-visible { outline: 2px solid var(--accent); }
  label.f span small { display: block; color: var(--text-3); font-size: 11.5px; }
  input[type=number], select { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; text-align: right; font-variant-numeric: tabular-nums; }
  select { text-align: left; }
  label.c { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; }
  label.c small { display: block; color: var(--text-3); font-size: 11.5px; }
  .disabled { opacity: .45; }
  .reset { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; cursor: pointer; }
  .reset:hover { background: var(--bar-track); }
  .reset:focus-visible { outline: 2px solid var(--accent); }
  .help { text-decoration: underline dotted var(--text-3); text-underline-offset: 3px; cursor: help; }
  [hidden] { display: none !important; }
  .hero { display: flex; flex-wrap: wrap; gap: 12px 32px; }
  .hero div b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .hero div span { color: var(--text-2); font-size: 12.5px; }
  .rank { display: grid; grid-template-columns: minmax(150px, max-content) 1fr max-content; gap: 3px 10px; align-items: center; }
  .rank button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 2px 6px 2px 2px; border-radius: 6px; white-space: nowrap; }
  .rank button:hover { background: var(--bar-track); }
  .rank button:focus-visible { outline: 2px solid var(--accent); }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--text-3); flex: none; }
  .track { height: 14px; background: var(--bar-track); border-radius: 0 4px 4px 0; }
  .track i { display: block; height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
  .val { font-variant-numeric: tabular-nums; text-align: right; }
  .val small { color: var(--text-3); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 4px 0 6px; color: var(--text-2); font-size: 13px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 3px; border-radius: 2px; }
  .chartwrap { position: relative; }
  svg { display: block; width: 100%; height: auto; }
  svg text { fill: var(--text-3); font-size: 11px; }
  svg .lbl { fill: var(--text-2); font-size: 11.5px; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.15); display: none; white-space: nowrap; z-index: 2; }
  .tip b { display: block; margin-bottom: 2px; }
  .tip div { display: flex; align-items: center; gap: 6px; }
  .tip div i { width: 8px; height: 8px; border-radius: 50%; }
  .tip div span { margin-left: auto; padding-left: 14px; font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
  th, td { padding: 5px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
  th { color: var(--text-2); font-weight: 600; font-size: 12px; vertical-align: bottom; white-space: normal; }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
  td.strong { font-weight: 600; }
  .warn { color: var(--warn); }
  details { border-bottom: 1px solid var(--grid); padding: 6px 0; }
  details summary { cursor: pointer; font-weight: 600; }
  details ul { margin: 6px 0 4px; padding-left: 20px; color: var(--text-2); }
  .calc { max-width: 900px; margin-top: 8px; }
  .calc th { text-align: right; font-size: 13px; color: var(--text); }
  .calc td.diff { color: var(--text-2); }
  .calcpick { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; max-width: 900px; }
  .calcpick select { width: auto; min-width: 180px; }
  .calcpick span { color: var(--text-2); }
  .calcnotes h3 { font-size: 13px; margin: 0 0 4px; color: var(--text); }
  .calc td:first-child { white-space: normal; }
  .calc tr.sec td { font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-2); padding-top: 14px; border-bottom: 1px solid var(--border); }
  .calc tr.tot td { font-weight: 600; border-top: 1px solid var(--text-3); }
  .calc td.pct { color: var(--text-3); font-size: 12px; text-align: left; padding-left: 0; }
  .calcnotes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px 24px; margin: 14px 0 0; color: var(--text-2); font-size: 13px; max-width: 900px; }
  .calcnotes ul { margin: 0; padding-left: 18px; }
  details.pli { border: 0; padding: 2px 0 0; }
  details.pli summary { font-weight: 400; color: var(--text-2); font-size: 13px; }
  .disclaimer { border-left: 3px solid var(--warn); padding: 8px 12px; background: var(--bar-track); border-radius: 0 6px 6px 0; color: var(--text-2); font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <p class="disclaimer" style="grid-column:1/-1;margin:0" data-i18n="banner"></p>
  <aside>
    <div class="card">
      <div class="head"><h1 data-i18n="title"></h1><div class="langs" id="langs" role="group" data-i18n-aria="language"></div></div>
      <p class="sub" data-i18n="tagline"></p>
      <form id="form">
        <fieldset>
          <legend data-i18n="partner1"></legend>
          <label class="f"><span data-i18n="worksAs"></span><select name="role1"><option value="owner" data-i18n="owner"></option><option value="employee" data-i18n="employee"></option></select></label>
          <label class="f" id="profitRow1" data-i18n-title="profitTip"><span><span class="help" data-i18n="profit"></span><small data-i18n="profitHint"></small></span><input type="number" name="profit1" min="0" step="5000"></label>
          <label class="f" id="salaryRow1"><span><span class="lbl"></span><small></small></span><input type="number" name="salary1" min="0" step="5000"></label>
        </fieldset>
        <fieldset>
          <legend data-i18n="partner2"></legend>
          <label class="c"><input type="checkbox" name="hasPartner2"><span><span data-i18n="hasPartner2"></span><small data-i18n="hasPartner2Hint"></small></span></label>
          <div id="partner2">
            <label class="f"><span data-i18n="worksAs"></span><select name="role2"><option value="owner" data-i18n="owner"></option><option value="employee" data-i18n="employee"></option></select></label>
            <label class="f" id="profitRow2" data-i18n-title="profitTip"><span><span class="help" data-i18n="profit"></span><small data-i18n="profitHint"></small></span><input type="number" name="profit2" min="0" step="5000"></label>
            <label class="f" id="salaryRow2"><span><span class="lbl"></span><small></small></span><input type="number" name="salary2" min="0" step="5000"></label>
          </div>
        </fieldset>
        <fieldset>
          <legend data-i18n="family"></legend>
          <label class="f"><span><span data-i18n="children"></span></span><input type="number" name="kids" min="0" max="8" step="1"></label>
          <label class="f"><span><span data-i18n="living"></span><small id="livingHint"></small></span><input type="number" name="living" min="0" step="1000"></label>
          <label class="c"><input type="checkbox" name="adjustLiving"><span><span data-i18n="adjustLiving"></span><small data-i18n="adjustLivingHint"></small></span></label>
          <div id="pliBox">
            <label class="f"><span data-i18n="livingRef"></span><select name="livingRef"></select></label>
            <details class="pli"><summary data-i18n="priceLevels"></summary><div id="pliList"></div></details>
          </div>
        </fieldset>
        <fieldset>
          <legend data-i18n="investing"></legend>
          <label class="f"><span data-i18n="strategy"></span><select name="mode"><option value="fixed" data-i18n="modeFixed"></option><option value="all" data-i18n="modeAll"></option></select></label>
          <label class="f" id="monthlyRow"><span><span data-i18n="monthly"></span><small data-i18n="monthlyHint"></small></span><input type="number" name="monthly" min="0" step="100"></label>
          <label class="f"><span><span data-i18n="startCapital"></span><small data-i18n="startCapitalHint"></small></span><input type="number" name="startCapital" min="0" step="5000"></label>
          <label class="f"><span><span data-i18n="returnPct"></span><small data-i18n="returnHint"></small></span><input type="number" name="returnPct" min="-10" max="20" step="0.5"></label>
          <label class="f"><span><span data-i18n="horizon"></span><small data-i18n="horizonHint"></small></span><input type="number" name="years" min="1" max="50" step="1"></label>
          <label class="c"><input type="checkbox" name="beHarvest"><span><span data-i18n="beHarvest"></span><small data-i18n="beHarvestHint"></small></span></label>
          <label class="c"><input type="checkbox" name="useWrappers"><span><span data-i18n="useWrappers"></span><small data-i18n="useWrappersHint"></small></span></label>
        </fieldset>
        <fieldset id="ownerOpts">
          <legend data-i18n="companyOptions"></legend>
          <label class="c"><input type="checkbox" name="optimizeSalary"><span><span data-i18n="optimizeSalary"></span><small data-i18n="optimizeSalaryHint"></small></span></label>
          <label class="c"><input type="checkbox" name="beVvprbis"><span><span data-i18n="beVvprbis"></span><small data-i18n="beVvprbisHint"></small></span></label>
          <label class="c"><input type="checkbox" name="beOptimize"><span><span data-i18n="beOptimize"></span><small data-i18n="beOptimizeHint"></small></span></label>
          <label class="f" id="beRoyaltyRow"><span><span data-i18n="beRoyalty"></span><small data-i18n="beRoyaltyHint"></small></span><input type="number" name="beRoyalty" min="0" step="1000"></label>
          <label class="f"><span><span data-i18n="bePension"></span><small id="bePensionHint"></small></span><input type="number" name="bePension" min="0" step="1000"></label>
          <label class="f" id="beCompanyRow"><span><span data-i18n="beCompanyInvest"></span><small data-i18n="beCompanyInvestHint"></small></span><input type="number" name="beCompanyInvest" min="0" step="1000"></label>
        </fieldset>
        <button type="button" id="reset" class="reset" data-i18n="reset" data-i18n-title="resetTip"></button>
      </form>
    </div>
  </aside>

  <main>
    <div class="card">
      <div class="hero" id="hero"></div>
    </div>

    <div class="card">
      <h2 id="rankTitle"></h2>
      <p class="sub" data-i18n="rankSub"></p>
      <div class="rank" id="rank"></div>
    </div>

    <div class="card">
      <h2 data-i18n="chartTitle"></h2>
      <p class="sub" data-i18n="chartSub"></p>
      <div class="legend" id="legend"></div>
      <div class="chartwrap"><svg id="chart" viewBox="0 0 760 320" role="img" data-i18n-aria="chartAria"></svg><div class="tip" id="tip"></div></div>
    </div>

    <div class="card">
      <h2 data-i18n="tableTitle"></h2>
      <p class="sub" data-i18n="tableSub"></p>
      <div class="scroll"><table id="table"></table></div>
    </div>

    <div class="card">
      <h2 data-i18n="calcTitle"></h2>
      <p class="sub" data-i18n="calcSub"></p>
      <div class="calcpick"><select id="calcCountry" data-i18n-aria="firstCountry"></select><span data-i18n="comparedWith"></span><select id="calcCountry2" data-i18n-aria="secondCountry"></select></div>
      <div class="scroll"><table id="calc" class="calc"></table></div>
      <div id="calcNotes" class="calcnotes"></div>
    </div>

    <div class="card">
      <h2 data-i18n="notesTitle"></h2>
      <p class="sub" data-i18n="notesSub"></p>
      <div id="notes"></div>
      <p class="disclaimer" style="margin-top:14px" data-i18n="disclaimer"></p>
    </div>
  </main>
</div>

  /* Convert local-currency models to EUR in/out. */
  function localize(c) {

    const hL = h => ({ ...h, salaryA: L(h.salaryA), salaryB: L(h.salaryB), eeA: L(h.eeA), eeB: L(h.eeB), divA: L(h.divA), divB: L(h.divB) });

    if (inv.yieldTax && typeof inv.yieldTax.rate === 'function') out.yieldTax = { ...inv.yieldTax, rate: h => inv.yieldTax.rate(hL(h)) };
    if (inv.wrapper) out.wrapper = {

      annualCap: inv.wrapper.annualCap && E(inv.wrapper.annualCap),

    return {

  const COUNTRIES = C.map(localize);

})(typeof window !== 'undefined' ? window : globalThis);

<script>
/*
 * Calculation engine: household net income per country, then a year-by-year
 * simulation of monthly ETF investing under that country's investment taxes.
 *
 * Inputs (inp):
 *   role1, role2        'owner' | 'employee'
 *   profit1, profit2    company profit before owner pay (owners only)
 *   salary1, salary2    gross salary (for an owner: the salary taken from the company)
 *   hasPartner2         false = single person household
 *   optimizeSalary      pick the best salary/dividend split for each owner, per country
 *   kids, living, mode ('fixed' | 'all'), monthly, startCapital, returnPct, years,
 *   useWrappers, beVvprbis
 *   beRoyalty, bePension, beCompanyInvest   €/year through the company routes of a country that has them (c.routes)
 *   beHarvest                               realise the yearly tax-free gain allowance where a country has one (invest.harvest)
 *   beOptimize                              pick the route amounts that give the most final wealth (bePension = ceiling)
 *   adjustLiving, livingRef, pli_XX         scale living costs by each country's price level
 */
(function (root) {
  'use strict';

  const DIV_YIELD = 0.015; // assumed internal dividend yield of a global equity ETF
  const pos = x => Math.max(0, x);

  /** Largest owner salary the company can pay (salary + employer contributions ≤ profit). */
  function maxOwnerSalary(c, profit) {
    const ownerSS = c.ownerSS || c.employeeSS;
    let lo = 0, hi = profit;
    for (let i = 0; i < 40; i++) {
      const mid = (lo + hi) / 2;
      if (mid + ownerSS(mid).er <= profit) lo = mid; else hi = mid;
    }
    return lo;
  }

  /** The partners of the household as {role, profit, salary}, partner 2 only if present. */
  function partners(inp) {
    const list = [{ role: inp.role1, profit: inp.profit1, salary: inp.salary1 }];
    if (inp.hasPartner2) list.push({ role: inp.role2, profit: inp.profit2, salary: inp.salary2 });
    return list.map(p => ({ role: p.role === 'owner' ? 'owner' : 'employee', profit: pos(p.profit || 0), salary: pos(p.salary || 0) }));
  }

  /** Money flow for one partner at a given salary. rt = amounts for the country's company routes, or null. */
  function partnerAt(c, p, salary, rt) {
    if (p.role === 'owner') {
      const ss = (c.ownerSS || c.employeeSS)(salary);
      const R = rt && c.routes ? c.routes : null;
      let avail = pos(p.profit - salary - ss.er);
      // royalties: deductible for the company, capped as a share of total pay (salary + royalties)
      const royalty = R && R.royalty
        ? Math.min(pos(rt.royalty), R.royalty.cap, salary * R.royalty.maxShare / (1 - R.royalty.maxShare), avail) : 0;
      avail -= royalty;
      const pension = R && R.pension ? Math.min(pos(rt.pension), avail) : 0;
      const taxableProfit = avail - pension;
      const corpTax = c.corpTax(taxableProfit, { ownerSalary: salary });
      const after = taxableProfit - corpTax;
      const retained = R && R.companyInvest ? Math.min(pos(rt.companyInvest), after) : 0;
      return { role: 'owner', profit: p.profit, salary, ee: ss.ee, er: ss.er, royalty, pension, taxableProfit, corpTax, retained, dividend: after - retained, gross: p.profit };
    }
    const ss = salary > 0 ? c.employeeSS(salary) : { ee: 0, er: 0 };
    return { role: 'employee', profit: 0, salary, ee: ss.ee, er: ss.er, royalty: 0, pension: 0, taxableProfit: 0, corpTax: 0, retained: 0, dividend: 0, gross: salary };
  }

  /** One year of household cash flow for given salaries (one per partner). */
  function householdAt(c, inp, ps, salaries, rt) {
    const fo = ps.findIndex(p => p.role === 'owner'); // company routes apply to the first owner's company
    const a = partnerAt(c, ps[0], salaries[0], fo === 0 ? rt : null);
    const b = ps[1] ? partnerAt(c, ps[1], salaries[1], fo === 1 ? rt : null) : null;
    const h = {
      salaryA: a.salary, eeA: a.ee, divA: a.dividend, ownerA: a.role === 'owner',
      salaryB: b ? b.salary : 0, eeB: b ? b.ee : 0, divB: b ? b.dividend : 0, ownerB: !!b && b.role === 'owner',
      single: !b, kids: inp.kids, beVvprbis: !!inp.beVvprbis,
    };
    const pt = c.personalTax(h);
    const list = b ? [a, b] : [a];
    const sum = f => list.reduce((s, x) => s + f(x), 0);
    const gross = sum(x => x.gross);
    const royalty = sum(x => x.royalty);
    const royaltyTax = royalty > 0 ? royalty * c.routes.royalty.rate : 0;
    const net = sum(x => x.salary - x.ee + x.dividend) + royalty - royaltyTax - pt.incomeTax - pt.dividendTax + pt.childBenefit;
    return {
      ...h, a, b,
      salaries: sum(x => x.salary),
      dividend: sum(x => x.dividend),
      royalty, royaltyTax,
      pension: sum(x => x.pension),
      retained: sum(x => x.retained),
      corpTax: sum(x => x.corpTax),
      // owners bear both sides of their contributions; an employee's employer share is not the family's cost
      social: sum(x => x.ee + (x.role === 'owner' ? x.er : 0)),
      incomeTax: pt.incomeTax,
      dividendTax: pt.dividendTax,
      childBenefit: pt.childBenefit,
      gross, net,
      keptShare: gross > 0 ? net / gross : 0,
    };
  }

  /** Price level used for a country: the user's override if given, else the country's own. */
  function priceLevel(c, inp) {
    const o = inp['pli_' + c.code];
    return o > 0 ? o : c.priceLevel || 100;
  }

  /** Living costs in this country: the entered amount scaled from the reference country's price level. */
  function livingFor(c, inp, countries) {
    if (!inp.adjustLiving) return inp.living;
    const ref = (countries || []).find(x => x.code === inp.livingRef);
    return ref ? inp.living * priceLevel(c, inp) / priceLevel(ref, inp) : inp.living;
  }

  /** Household result, with owner salaries either as entered or optimised for this country. */
  function household(c, inp, countries, rtOverride, cache) {
    const ps = partners(inp);
    // allowed salary range per partner; employees are fixed at their salary
    const range = ps.map(p => {
      if (p.role !== 'owner') return [p.salary, p.salary];
      const max = maxOwnerSalary(c, p.profit);
      return [Math.min(c.minOwnerSalary || 0, max), max];
    });
    const solve = rt => {
      if (!inp.optimizeSalary) {
        const s = ps.map((p, i) => Math.min(Math.max(p.salary, range[i][0]), range[i][1]));
        return { ...householdAt(c, inp, ps, s, rt), salaryAdjusted: s.some((v, i) => Math.abs(v - ps[i].salary) > 1) };
      }
      const grid = ([lo, hi], n) => hi - lo < 1 ? [lo] : Array.from({ length: n + 1 }, (_, i) => lo + (hi - lo) * i / n);
      const owners = ps.filter(p => p.role === 'owner').length;
      const n = owners > 1 ? 60 : 200;
      let best = null;
      for (const s0 of grid(range[0], n)) {
        for (const s1 of ps[1] ? grid(range[1], n) : [0]) {
          const r = householdAt(c, inp, ps, [s0, s1], rt);
          if (!best || r.net > best.net) best = r;
        }
      }
      return { ...best, salaryAdjusted: false };
    };
    const rt = !c.routes ? null : rtOverride || { royalty: +inp.beRoyalty || 0, pension: +inp.bePension || 0, companyInvest: +inp.beCompanyInvest || 0 };
    // Salaries are settled first, on income alone; pension and company investing then divert profit at those salaries.
    const saving = rt && (rt.pension > 0 || rt.companyInvest > 0);
    let base = cache && cache.base;
    if (!base) { base = solve(saving ? { ...rt, pension: 0, companyInvest: 0 } : rt); if (cache) cache.base = base; }
    const hh = saving
      ? { ...householdAt(c, inp, ps, [base.a.salary, base.b ? base.b.salary : 0], rt), salaryAdjusted: base.salaryAdjusted }
      : base;
    // what the pension and company-investing routes cost the household in net income
    return { ...hh, routeCost: pos(base.net - hh.net), living: livingFor(c, inp, countries) };
  }

  /** Simulate monthly investing for inp.years years. Returns yearly points incl. year 0. */
  function simulate(c, hh, inp) {
    const inv = c.invest;
    const mg = Math.pow(1 + inp.returnPct / 100, 1 / 12) - 1;
    const living = hh.living === undefined ? inp.living : hh.living;
    const surplus = pos(hh.net - living) / 12;
    // company routes are paid for out of the same monthly saving effort, so countries stay comparable
    const routeCost = (hh.routeCost || 0) / 12;
    const target = pos(inp.monthly - routeCost);
    const monthly = inp.mode === 'all' ? surplus : Math.min(target, surplus);
    const R = c.routes || {};
    const penM = hh.pension > 0 ? hh.pension / 12 / (1 + R.pension.premiumTax) : 0;
    const coM = hh.retained > 0 ? hh.retained / 12 : 0;
    const pen = { v: 0 }, comp = { v: 0, b: 0 }; // company pension plan, portfolio held by the company
    let companyExtra = 0; // pre-tax money the company puts in beyond what it costs the household
    const buyTax = inv.buyTax || 0, sellTax = inv.sellTax || 0;

    // Country models are written for a couple who own the portfolio jointly. For a single person the
    // per-person thresholds are half as large: evaluate each tax at twice the amount and halve the result.
    const S = hh.single, k = S ? 0.5 : 1;
    const hS = S ? { ...hh, divA: 2 * hh.divA } : hh;
    const cgt = g => inv.cgt ? (S ? inv.cgt(2 * g, hS) / 2 : inv.cgt(g, hh)) : 0;
    const mtmTax = g => S ? inv.mtm.tax(2 * g, hS) / 2 : inv.mtm.tax(g, hh);
    const assetTax = (v, yg) => S && !inv.assetTaxPerAccount ? inv.assetTax(2 * v, 2 * yg, hS) / 2 : inv.assetTax(v, yg, hh);
    // yearly harvesting: sell and rebuy enough to realise the tax-free gain allowance, which lifts the cost basis
    const harvest = inp.beHarvest && inv.harvest ? inv.harvest : null;
    const exempt = harvest ? 0 : (inv.cgtExempt || 0) * k; // with harvesting, the year's allowance is already used
    const W = inp.useWrappers && inv.wrapper ? inv.wrapper : null;
    const annualCap = W && W.annualCap ? W.annualCap * k : Infinity;
    const lifetimeCap = W && W.lifetimeCap ? W.lifetimeCap * k : Infinity;

    const wrap = { v: 0, b: 0 };
    const cohorts = []; // taxable account, one cohort per contribution year
    if (inp.startCapital > 0) cohorts.push({ v: inp.startCapital, b: inp.startCapital, age: 0 });
    let contributed = inp.startCapital || 0, taxesPaid = 0;

    const sumV = () => cohorts.reduce((s, x) => s + x.v, 0);
    const sumB = () => cohorts.reduce((s, x) => s + x.b, 0);
    const pay = tax => { // sell a slice of the taxable account to pay a tax bill
      const V = sumV();
      if (tax <= 0 || V <= 0) return;
      const f = pos(1 - tax / V);
      for (const x of cohorts) { x.v *= f; x.b *= f; }
      taxesPaid += Math.min(tax, V);
    };
    const snapshot = year => {
      const V = sumV(), B = sumB();
      const sell = V * sellTax;
      const raw = inv.gainFactor
        ? cohorts.reduce((s, x) => s + pos(x.v - x.b) * inv.gainFactor(x.age - 0.5), 0) - sell
        : V - sell - B;
      const cg = cgt(pos(raw - exempt));
      const wrapTax = W ? pos(wrap.v - wrap.b) * W.cgtRate : 0;
      const pensionNet = pen.v > 0 ? R.pension.payout(pen.v) : 0;
      // company portfolio: tax on the gain inside the company, then dividend tax to get it out
      const companyNet = comp.v > 0 ? (comp.v - R.companyInvest.gainTax * pos(comp.v - comp.b)) * (1 - R.companyInvest.payoutRate(hh)) : 0;
      return {
        year, contributed, companyExtra, pensionNet, companyNet,
        gross: V + wrap.v + pen.v + comp.v,
        net: V - sell - cg + wrap.v - wrapTax + pensionNet + companyNet,
        taxesSoFar: taxesPaid,
        exitTax: sell + cg + wrapTax + (pen.v - pensionNet) + (comp.v - companyNet),
      };
    };

    const points = [snapshot(0)];
    for (let y = 1; y <= inp.years; y++) {
      const startV = sumV();
      const co = { v: 0, b: 0, age: 0 };
      cohorts.push(co);
      let contribTaxable = 0, wrapYear = 0;
      for (let m = 0; m < 12; m++) {
        for (const x of cohorts) x.v *= 1 + mg;
        wrap.v *= 1 + mg;
        let amt = monthly;
        if (W) {
          const room = Math.min(annualCap - wrapYear, lifetimeCap - wrap.b);
          const w = Math.min(amt, pos(room));
          wrap.v += w; wrap.b += w; wrapYear += w; amt -= w;
        }
        co.v += amt * (1 - buyTax); co.b += amt;
        taxesPaid += amt * buyTax;
        contribTaxable += amt;
        contributed += monthly + routeCost;
        pen.v = pen.v * (1 + mg) + penM;
        comp.v = comp.v * (1 + mg) + coM; comp.b += coM;
        taxesPaid += hh.pension / 12 - penM; // premium tax
        companyExtra += hh.pension / 12 + coM - routeCost;
      }
      if (comp.v > 0 && R.companyInvest.assetTax) { const t = R.companyInvest.assetTax(comp.v); comp.v -= t; taxesPaid += t; }
      for (const x of cohorts) x.age++;

      const V = sumV();
      const yearGain = V - startV - contribTaxable;

      if (inv.yieldTax && V > 0) {
        const base = V * DIV_YIELD;
        if (inv.yieldTax.stepUp) for (const x of cohorts) x.b += base * x.v / V;
        const yr = inv.yieldTax.rate;
        pay(base * (typeof yr === 'function' ? yr(hh) : yr));
      }
      if (inv.accrual && V > 0) {
        const base = Math.min(pos(yearGain), startV * inv.accrual.baseRate);
        if (base > 0) {
          for (const x of cohorts) x.b += base * x.v / V;
          pay(base * inv.accrual.rate);
        }
      }
      if (inv.mtm) {
        const elig = cohorts.filter(x => x.age % inv.mtm.every === 0 && x.v > x.b);
        const G = elig.reduce((s, x) => s + x.v - x.b, 0);
        if (G > 0) {
          const T = mtmTax(G);
          for (const x of elig) {
            const t = T * (x.v - x.b) / G;
            x.v -= t; x.b = x.v;
          }
          taxesPaid += T;
        }
      }
      if (inv.assetTax) pay(assetTax(sumV(), yearGain));
      if (harvest) {
        const Vh = sumV(), G = cohorts.reduce((s, x) => s + pos(x.v - x.b), 0);
        const g = Math.min(harvest.perYear * k, G);
        if (g > 0) {
          const cost = harvest.cost * g * Vh / G; // transaction tax on the slice sold and bought back
          for (const x of cohorts) x.b += g * pos(x.v - x.b) / G;
          pay(cost);
        }
      }

      points.push(snapshot(y));
    }
    return { monthly, capped: inp.mode !== 'all' && monthly < target - 0.5, surplusLeft: (surplus - monthly) * 12, points, wrapper: W ? W.name : null };
  }

  /**
   * Best use of a country's company routes: royalties at the legal maximum, then the pension premium
   * (up to the entered ceiling) and the amount invested inside the company that give the most final wealth.
   * The household must still cover its living costs, and with a fixed monthly amount the routes may not
   * cost more net income than that amount.
   */
  function optimizeRoutes(c, inp, countries) {
    const budget = inp.mode === 'all' ? Infinity : inp.monthly * 12;
    const cache = {};
    const run = (pension, companyInvest) => {
      const hh = household(c, inp, countries, { royalty: Infinity, pension, companyInvest }, cache);
      const ok = hh.net >= hh.living - 1 && hh.routeCost <= budget + 1;
      return { hh, ok };
    };
    const maxCompany = partners(inp).filter(p => p.role === 'owner').reduce((m, p) => Math.max(m, p.profit), 0);
    const ceiling = pos(+inp.bePension || 0);
    let best = null;
    const consider = (pension, companyInvest) => {
      const { hh, ok } = run(pension, companyInvest);
      if (!ok && best) return;
      const sim = simulate(c, hh, inp);
      const net = sim.points[sim.points.length - 1].net;
      if (!best || !best.ok && ok || best.ok === ok && (net > best.net + 1 || Math.abs(net - best.net) <= 1 && hh.net > best.hh.net)) best = { hh, sim, net, ok };
    };
    const NP = ceiling > 0 ? 8 : 0, NC = 8;
    for (let i = 0; i <= NP; i++) {
      const pension = NP ? ceiling * i / NP : 0;
      if (i > 0 && !run(pension, 0).ok) break;
      let lo = 0, hi = maxCompany; // largest affordable amount to keep in the company
      for (let k = 0; k < 18; k++) { const mid = (lo + hi) / 2; if (run(pension, mid).ok) lo = mid; else hi = mid; }
      for (let j = 0; j <= NC; j++) consider(pension, lo * j / NC);
    }
    return best;
  }

  /** Full comparison across all countries, sorted by final after-tax wealth. */
  function compare(countries, inp) {
    return countries.map(c => {
      const opt = inp.beOptimize && c.routes ? optimizeRoutes(c, inp, countries) : null;
      const hh = opt ? opt.hh : household(c, inp, countries);
      const sim = opt ? opt.sim : simulate(c, hh, inp);
      const last = sim.points[sim.points.length - 1];
      return { country: c, hh, sim, finalNet: last.net, finalGross: last.gross, contributed: last.contributed, investTax: last.taxesSoFar + last.exitTax };
    }).sort((a, b) => (Math.abs(b.finalNet - a.finalNet) > 1 ? b.finalNet - a.finalNet : b.hh.net - a.hh.net));
  }

  const Engine = { household, simulate, compare, maxOwnerSalary, priceLevel };
  if (typeof module !== 'undefined' && module.exports) module.exports = Engine;
  else root.Engine = Engine;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  'use strict';
  const DEFAULTS = { role1: 'owner', profit1: 80000, salary1: 50000, hasPartner2: true, role2: 'employee', profit2: 80000, salary2: 50000,
    optimizeSalary: false, kids: 2, living: 50000,
    mode: 'all', monthly: 1500, startCapital: 0, returnPct: 7, years: 20, useWrappers: true, beVvprbis: true,
    beHarvest: true, beOptimize: false, beRoyalty: 0, bePension: 0, beCompanyInvest: 0, adjustLiving: true, livingRef: 'BE' };
  for (const c of COUNTRIES) DEFAULTS['pli_' + c.code] = c.priceLevel;
  const KEY = 'country-compare-v1';
  const $ = id => document.getElementById(id);
  const form = $('form');
  const short = v => Math.abs(v) >= 1e6 ? '€' + (v / 1e6).toFixed(Math.abs(v) >= 1e7 ? 1 : 2) + 'M' : '€' + Math.round(v / 1e3) + 'k';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  const old = saved.inputs || {};
  if (old.profit !== undefined && old.role1 === undefined) { // inputs saved by the first version of this page
    old.profit1 = old.profit; old.salary1 = old.ownerSalary; old.salary2 = old.spouseSalary;
  }
  let inputs = { ...DEFAULTS, ...old };
  let selected = saved.selected || null; // {code: slot}
  let results = [];

  if (!COUNTRIES.some(c => c.code === inputs.livingRef)) inputs.livingRef = DEFAULTS.livingRef;

  // ── language ──
  const FLAGS = { en: '🇬🇧', nl: '🇳🇱', fr: '🇫🇷', de: '🇩🇪', it: '🇮🇹' };
  const langs = Object.keys(FLAGS).filter(l => LANG[l]);
  let lang = langs.includes(saved.lang) ? saved.lang
    : (navigator.languages || [navigator.language || 'en']).map(l => l.slice(0, 2).toLowerCase()).find(l => langs.includes(l)) || 'en';
  let eur, regionNames;
  /** Interface text for a key in the current language; {name} parts are filled from v. */
  const t = (k, v) => {
    const s = LANG[lang].ui[k] !== undefined ? LANG[lang].ui[k] : LANG.en.ui[k] !== undefined ? LANG.en.ui[k] : k;
    return v ? s.replace(/\{(\w+)\}/g, (m, n) => v[n] !== undefined ? v[n] : m) : s;
  };
  const cname = c => {
    let n = c.name;
    try { n = regionNames.of(c.code === 'UK' ? 'GB' : c.code) || c.name; } catch (e) {}
    return c.code === 'CH' ? `${n} (${t('zurich')})` : n;
  };
  const byName = list => [...list].sort((a, b) => cname(a.country || a).localeCompare(cname(b.country || b), lang));
  const notesOf = c => (LANG[lang].notes && LANG[lang].notes[c.code]) || c.notes;

  function setLang(l) {
    lang = l;
    eur = new Intl.NumberFormat(LANG[l].locale, { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
    try { regionNames = new Intl.DisplayNames([l], { type: 'region' }); } catch (e) { regionNames = null; }
    document.documentElement.lang = l;
    document.title = t('title');
    for (const el of document.querySelectorAll('[data-i18n]')) el.innerHTML = t(el.dataset.i18n);
    for (const el of document.querySelectorAll('[data-i18n-title]')) el.title = t(el.dataset.i18nTitle);
    for (const el of document.querySelectorAll('[data-i18n-aria]')) el.setAttribute('aria-label', t(el.dataset.i18nAria));
    $('langs').innerHTML = langs.map(x =>
      `<button type="button" data-lang="${x}" title="${esc(LANG[x].name)}" aria-label="${esc(LANG[x].name)}" aria-pressed="${x === l}">${FLAGS[x]}</button>`).join('');
    // country lists are sorted by their name in this language
    form.elements.livingRef.innerHTML = byName(COUNTRIES).map(c => `<option value="${c.code}">${c.flag} ${esc(cname(c))}</option>`).join('');
    $('pliList').innerHTML = byName(COUNTRIES).map(c => `<label class="f"><span>${c.flag} ${esc(cname(c))}</span><input type="number" name="pli_${c.code}" min="1" step="1"></label>`).join('');
  }
  setLang(lang);
  $('langs').addEventListener('click', e => {
    const b = e.target.closest('button[data-lang]');
    if (!b || b.dataset.lang === lang) return;
    setLang(b.dataset.lang); fillForm(); update();
  });

  function fillForm() {
    for (const el of form.elements) {
      if (!el.name) continue;
      if (el.type === 'checkbox') el.checked = !!inputs[el.name]; else el.value = inputs[el.name];
    }
  }
  fillForm();

  function readInputs() {
    const o = {};
    for (const el of form.elements) {
      if (!el.name) continue;
      if (el.type === 'checkbox') o[el.name] = el.checked;
      else if (el.type === 'number') { const v = parseFloat(el.value); o[el.name] = Number.isFinite(v) ? v : 0; }
      else o[el.name] = el.value;
    }
    o.years = Math.max(1, Math.min(50, Math.round(o.years)));
    o.kids = Math.max(0, Math.min(8, Math.round(o.kids)));
    for (const k of ['profit1', 'salary1', 'profit2', 'salary2', 'living', 'monthly', 'startCapital', 'beRoyalty', 'bePension', 'beCompanyInvest']) o[k] = Math.max(0, o[k]);
    return o;
  }

  function save() { try { localStorage.setItem(KEY, JSON.stringify({ inputs, selected, calcCode, calcCode2, lang })); } catch (e) {} }

  function update() {
    inputs = readInputs();
    const owner1 = inputs.role1 === 'owner', owner2 = inputs.hasPartner2 && inputs.role2 === 'owner';
    $('partner2').hidden = !inputs.hasPartner2;
    $('ownerOpts').hidden = !owner1 && !owner2;
    [[1, owner1], [2, owner2]].forEach(([i, owner]) => {
      $('profitRow' + i).hidden = !owner;
      const row = $('salaryRow' + i);
      row.classList.toggle('disabled', owner && inputs.optimizeSalary);
      row.querySelector('.lbl').textContent = t(owner ? 'ownerSalary' : 'grossSalary');
      row.querySelector('small').textContent = t(owner ? 'ownerSalaryHint' : 'perYear');
    });
    $('monthlyRow').classList.toggle('disabled', inputs.mode === 'all');
    $('pliBox').hidden = !inputs.adjustLiving;
    $('beRoyaltyRow').classList.toggle('disabled', inputs.beOptimize);
    $('beCompanyRow').classList.toggle('disabled', inputs.beOptimize);
    $('bePensionHint').textContent = t(inputs.beOptimize ? 'bePensionHintOpt' : 'bePensionHint');
    const ref = COUNTRIES.find(c => c.code === inputs.livingRef);
    $('livingHint').textContent = inputs.adjustLiving ? t('livingHintAdj', { country: cname(ref) }) : t('livingHintSame');
    results = Engine.compare(COUNTRIES, inputs);
    if (!selected) {
      const n = results.length, pick = [0, Math.floor(n / 3), Math.floor(2 * n / 3), n - 1];
      selected = {};
      pick.forEach((i, slot) => { selected[results[i].country.code] = slot + 1; });
    }
    renderHero(); renderRank(); renderChart(); renderTable(); renderCalc(); renderNotes();
    save();
  }

  function renderHero() {
    const best = results[0], worst = results[results.length - 1];
    const byIncome = [...results].sort((a, b) => b.hh.net - a.hh.net)[0];
    $('hero').innerHTML =
      `<div><b>${best.country.flag} ${esc(cname(best.country))}</b><span>${esc(t('heroBest', { years: inputs.years, amount: eur.format(best.finalNet) }))}</span></div>` +
      `<div><b>${eur.format(best.finalNet - worst.finalNet)}</b><span>${esc(t('heroGap', { country: worst.country.flag + ' ' + cname(worst.country) }))}</span></div>` +
      `<div><b>${byIncome.country.flag} ${esc(cname(byIncome.country))}</b><span>${esc(t('heroIncome', { amount: eur.format(byIncome.hh.net) }))}</span></div>`;
  }

  function renderRank() {
    $('rankTitle').textContent = t('rankTitle', { years: inputs.years });
    const max = Math.max(1, ...results.map(r => r.finalNet));
    $('rank').innerHTML = results.map(r => {
      const c = r.country, slot = selected[c.code];
      const dot = slot ? `style="background:var(--s${slot});border-color:var(--s${slot})"` : '';
      const tip = esc(t('rankTip', { invested: eur.format(r.contributed), gross: eur.format(r.finalGross), taxes: eur.format(r.investTax) }));
      return `<button type="button" data-code="${c.code}" aria-pressed="${!!slot}" title="${esc(t('showInChart'))}"><i class="dot" ${dot}></i>${c.flag} ${esc(cname(c))}</button>` +
        `<div class="track" title="${tip}"><i style="width:${(100 * r.finalNet / max).toFixed(2)}%"></i></div>` +
        `<div class="val" title="${tip}">${eur.format(r.finalNet)}${r.sim.capped ? ` <small class="warn" title="${esc(t('cantAfford'))}">⚠</small>` : ''}</div>`;
    }).join('');
  }

  $('rank').addEventListener('click', e => {
    const b = e.target.closest('button[data-code]');
    if (!b) return;
    const code = b.dataset.code;
    if (selected[code]) delete selected[code];
    else {
      const used = new Set(Object.values(selected));
      const free = [1, 2, 3, 4].find(s => !used.has(s));
      if (!free) return; // already 4 selected
      selected[code] = free;
    }
    renderRank(); renderChart(); save();
  });

  // ── line chart ──
  const W = 760, H = 320, M = { l: 52, r: 120, t: 10, b: 26 };
  let chartState = null;

  function niceStep(max) {
    const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  }

  function renderChart() {
    const series = results.filter(r => selected[r.country.code])
      .map(r => ({ r, slot: selected[r.country.code] })).sort((a, b) => a.slot - b.slot);
    $('legend').innerHTML = series.length
      ? series.map(s => `<span><i style="background:var(--s${s.slot})"></i>${s.r.country.flag} ${esc(cname(s.r.country))}</span>`).join('')
      : `<span>${esc(t('legendEmpty'))}</span>`;
    const years = inputs.years;
    const maxV = Math.max(1, ...series.flatMap(s => s.r.sim.points.map(p => p.net)));
    const step = niceStep(maxV), top = Math.ceil(maxV / step) * step;
    const x = y => M.l + (W - M.l - M.r) * y / years;
    const yy = v => H - M.b - (H - M.t - M.b) * v / top;
    let svg = '';
    for (let v = 0; v <= top + 1e-6; v += step)
      svg += `<line x1="${M.l}" x2="${W - M.r}" y1="${yy(v)}" y2="${yy(v)}" stroke="var(--grid)"/><text x="${M.l - 8}" y="${yy(v) + 4}" text-anchor="end">${short(v)}</text>`;
    const xs = years <= 10 ? 1 : years <= 25 ? 5 : 10;
    for (let y = 0; y <= years; y += xs) svg += `<text x="${x(y)}" y="${H - 8}" text-anchor="middle">${esc(y === 0 ? t('now') : t('yr', { n: y }))}</text>`;
    // end labels, nudged apart
    const labels = series.map(s => ({ s, y: yy(s.r.sim.points[years].net) })).sort((a, b) => a.y - b.y);
    for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 14) labels[i].y = labels[i - 1].y + 14;
    for (const s of series) {
      const d = s.r.sim.points.map((p, i) => (i ? 'L' : 'M') + x(p.year).toFixed(1) + ' ' + yy(p.net).toFixed(1)).join('');
      svg += `<path d="${d}" fill="none" stroke="var(--s${s.slot})" stroke-width="2" stroke-linejoin="round"/>`;
    }
    for (const l of labels) svg += `<text class="lbl" x="${W - M.r + 8}" y="${l.y + 4}">${esc(l.s.r.country.code)} ${short(l.s.r.sim.points[years].net)}</text>`;
    svg += `<line id="cross" y1="${M.t}" y2="${H - M.b}" stroke="var(--text-3)" stroke-dasharray="3 3" visibility="hidden"/><g id="marks"></g>`;
    $('chart').innerHTML = svg;
    chartState = { series, x, yy, years };
    $('tip').style.display = 'none';
  }

  const chart = $('chart'), tip = $('tip');
  chart.addEventListener('pointermove', e => {
    if (!chartState || !chartState.series.length) return;
    const { series, x, yy, years } = chartState;
    const box = chart.getBoundingClientRect();
    const px = (e.clientX - box.left) * W / box.width;
    const yr = Math.max(0, Math.min(years, Math.round((px - M.l) / (W - M.l - M.r) * years)));
    const cross = chart.querySelector('#cross');
    cross.setAttribute('x1', x(yr)); cross.setAttribute('x2', x(yr)); cross.setAttribute('visibility', 'visible');
    chart.querySelector('#marks').innerHTML = series.map(s =>
      `<circle cx="${x(yr)}" cy="${yy(s.r.sim.points[yr].net)}" r="4" fill="var(--s${s.slot})" stroke="var(--surface)" stroke-width="2"/>`).join('');
    const rows = [...series].sort((a, b) => b.r.sim.points[yr].net - a.r.sim.points[yr].net);
    tip.innerHTML = `<b>${esc(yr === 0 ? t('today') : t('afterYear', { n: yr }))}</b>` +
      rows.map(s => `<div><i style="background:var(--s${s.slot})"></i>${esc(cname(s.r.country))}<span>${eur.format(s.r.sim.points[yr].net)}</span></div>`).join('') +
      `<div style="color:var(--text-3)">${esc(t('paidIn'))}<span>${eur.format(rows[0].r.sim.points[yr].contributed)}${new Set(rows.map(s => Math.round(s.r.sim.points[yr].contributed))).size > 1 ? ' ' + esc(t('varies')) : ''}</span></div>`;
    tip.style.display = 'block';
    const left = x(yr) * box.width / W;
    tip.style.left = (left + 14 + tip.offsetWidth > box.width ? left - tip.offsetWidth - 14 : left + 14) + 'px';
    tip.style.top = '12px';
  });
  chart.addEventListener('pointerleave', () => {
    tip.style.display = 'none';
    const cross = chart.querySelector('#cross');
    if (cross) cross.setAttribute('visibility', 'hidden');
    const marks = chart.querySelector('#marks');
    if (marks) marks.innerHTML = '';
  });

  function renderTable() {
    const n = v => eur.format(Math.round(v)).replace('€', '').trim();
    const head = ['thCountry', 'thSalaries', 'thDividends', 'thCorpTax', 'thSocial', 'thIncomeTax', 'thDividendTax', 'thChildBenefit',
      'thNet', 'thKept', 'thLiving', 'thInvested', 'thUnspent', 'thInvestTax', 'thWealth'].map(k => esc(t(k, { years: inputs.years })));
    $('table').innerHTML = '<thead><tr>' + head.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>' + results.map(r => {
      const h = r.hh, c = r.country;
      return `<tr><td>${c.flag} ${esc(cname(c))}</td>` +
        `<td>${n(h.salaries)}${h.salaryAdjusted ? ' <span class="warn" title="' + esc(t('salaryAdjustedTip')) + '">⚠</span>' : ''}</td>` +
        `<td>${n(h.dividend)}</td><td>${n(h.corpTax)}</td><td>${n(h.social)}</td><td>${n(h.incomeTax)}</td><td>${n(h.dividendTax)}</td><td>${n(h.childBenefit)}</td>` +
        `<td class="strong">${n(h.net)}</td><td>${(h.keptShare * 100).toFixed(0)}%</td><td>${n(h.living)}</td>` +
        `<td>${n(r.sim.monthly)}${r.sim.capped ? ' <span class="warn" title="' + esc(t('cappedTip')) + '">⚠</span>' : ''}</td>` +
        `<td>${n(r.sim.surplusLeft)}</td><td>${n(r.investTax)}</td><td class="strong">${n(r.finalNet)}</td></tr>`;
    }).join('') + '</tbody>';
  }

  function renderNotes() {
    const open = new Set([...document.querySelectorAll('#notes details[open]')].map(d => d.dataset.code));
    $('notes').innerHTML = byName(results).map(r => {
      const c = r.country;
      return `<details data-code="${c.code}" ${open.has(c.code) ? 'open' : ''}><summary>${c.flag} ${esc(cname(c))}</summary><ul>${notesOf(c).map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>`;
    }).join('');
  }

  let calcCode = saved.calcCode || null, calcCode2 = saved.calcCode2 || null;
  const calcSel = $('calcCountry'), calcSel2 = $('calcCountry2');
  calcSel.addEventListener('change', () => { calcCode = calcSel.value; renderCalc(); save(); });
  calcSel2.addEventListener('change', () => { calcCode2 = calcSel2.value; renderCalc(); save(); });

  /** The calculation for one country as a list of rows; the list has the same shape for every country. */
  function calcRows(r) {
    const h = r.hh, s = r.sim, last = s.points[s.points.length - 1];
    const pct = (a, b) => b > 0.5 ? (100 * a / b).toFixed(1) + '%' : '';
    const of = (a, b, what) => pct(a, b) && esc(t('of' + what, { p: pct(a, b) }));
    const rows = [];
    const sec = label => rows.push({ sec: true, label });
    const row = (label, v, note, tot) => rows.push({ label, v, note: note || '', tot: !!tot });
    const people = [h.a, h.b].filter(Boolean);
    const who = (i, what) => esc(people.length > 1 ? t('cPartner' + what, { n: i + 1 }) : t('cYour' + what));
    const adjusted = h.salaryAdjusted ? `<span class="warn" title="${esc(t('cAdjustedTip'))}">${esc(t('cAdjusted'))}</span>` : inputs.optimizeSalary ? esc(t('cBestMix')) : '';
    const leftover = Math.max(0, h.net - h.living);
    const growth = last.net + last.exitTax + last.taxesSoFar - last.contributed - last.companyExtra;
    const routes = inputs.beOptimize || inputs.beRoyalty > 0 || inputs.bePension > 0 || inputs.beCompanyInvest > 0; // rows shown for every country so the tables line up
    const beOnly = v => v > 0.5 ? '' : esc(t('cBeOnly'));
    const L = (k, v) => esc(t(k, v));
    people.forEach((p, i) => {
      if (p.role !== 'owner') return;
      sec(people.length > 1 ? L('cCompanyN', { n: i + 1 }) : L('cCompany'));
      row(L('cProfit'), p.profit);
      row(L('cOwnerSalary'), -p.salary, adjusted);
      row(L('cEmployerSS'), -p.er, of(p.er, p.salary, 'Salary'));
      if (routes) {
        row(L('cRoyaltyPaid'), -p.royalty, beOnly(p.royalty));
        row(L('cPensionPremium'), -p.pension, beOnly(p.pension));
      }
      row(L('cTaxableProfit'), p.taxableProfit, '', true);
      row(L('cCorpTax'), -p.corpTax, of(p.corpTax, p.taxableProfit, 'Profit'));
      if (routes) row(L('cRetained'), -p.retained, beOnly(p.retained));
      row(L('cDividendPaid'), p.dividend, '', true);
    });
    sec(L('cHousehold'));
    people.forEach((p, i) => {
      row(who(i, p.role === 'owner' ? 'OwnerSalary' : 'GrossSalary'), p.salary);
      row(who(i, 'OwnSS'), -p.ee, of(p.ee, p.salary, 'Salary'));
    });
    row(L(people.length > 1 ? 'cIncomeTaxBoth' : 'cIncomeTaxOne'), -h.incomeTax, of(h.incomeTax, h.salaries, 'Salaries'));
    if (people.some(p => p.role === 'owner')) {
      row(L('cDividends'), h.dividend);
      row(L('cDividendTax'), -h.dividendTax, of(h.dividendTax, h.dividend, 'Dividends'));
      if (routes) {
        row(L('cRoyalties'), h.royalty);
        row(L('cRoyaltyTax'), -h.royaltyTax, of(h.royaltyTax, h.royalty, 'Royalties'));
      }
    }
    row(L('cChildBenefit'), h.childBenefit);
    row(L('cNet'), h.net, L('cKept', { p: (h.keptShare * 100).toFixed(0) }), true);
    sec(L('cSaving'));
    row(L('cLiving'), -h.living, inputs.adjustLiving ? L('cPriceLevel', { n: Math.round(Engine.priceLevel(r.country, inputs)) }) : '');
    row(L('cLeftOver'), leftover, h.net < h.living ? `<span class="warn">${L('cNotCovered')}</span>` : '', true);
    row(L('cInvestedEtf'), s.monthly * 12, L('cPerMonth', { amount: eur.format(Math.round(s.monthly)) }) + (s.capped ? ` <span class="warn" title="${L('cLessThanPlanned')}">⚠</span>` : ''));
    if (routes) row(L('cGivenUp'), h.routeCost, h.routeCost > 0.5 ? L('cGivenUpNote') : '');
    row(L('cNotInvested'), s.surplusLeft);
    sec(L('cInvesting', { years: inputs.years }));
    row(L(inputs.startCapital > 0 ? 'cPaidInStart' : 'cPaidIn'), last.contributed, s.wrapper ? L('cUses', { name: s.wrapper }) : '');
    if (routes) row(L('cCompanyExtra'), last.companyExtra, last.companyExtra > 0.5 ? L('cTaxedLater') : '');
    row(L('cGrowth'), growth, L('cGrowthNote', { p: inputs.returnPct }));
    row(L('cTaxesAlong'), -last.taxesSoFar, of(last.taxesSoFar, growth, 'Growth'));
    row(L('cExitTax'), -last.exitTax, of(last.exitTax, growth, 'Growth'));
    row(L('cWealth', { years: inputs.years }), last.net, '', true);
    if (routes) {
      row(L('cOfPension'), last.pensionNet);
      row(L('cOfCompany'), last.companyNet);
    }
    return rows;
  }

  function renderCalc() {
    const has = code => results.some(r => r.country.code === code);
    if (!has(calcCode)) calcCode = results[0].country.code;
    if (!has(calcCode2) || calcCode2 === calcCode && !saved.calcCode2) calcCode2 = (results.find(r => r.country.code !== calcCode) || results[0]).country.code;
    const sorted = byName(results);
    const options = sel => sorted.map(r => `<option value="${r.country.code}" ${r.country.code === sel ? 'selected' : ''}>${r.country.flag} ${esc(cname(r.country))}</option>`).join('');
    calcSel.innerHTML = options(calcCode); calcSel2.innerHTML = options(calcCode2);
    const r1 = results.find(x => x.country.code === calcCode), r2 = results.find(x => x.country.code === calcCode2);
    const A = calcRows(r1), B = calcRows(r2);
    const fmt = v => (v < -0.5 ? '−' : '') + eur.format(Math.abs(Math.round(v)));
    const signed = v => Math.abs(v) < 0.5 ? '–' : (v > 0 ? '+' : '−') + eur.format(Math.abs(Math.round(v)));
    const name = r => `${r.country.flag} ${esc(cname(r.country))}`;
    let n = 0;
    $('calc').innerHTML =
      `<thead><tr><th></th><th>${name(r1)}</th><th></th><th>${name(r2)}</th><th></th><th title="${esc(t('differenceTip'))}">${esc(t('difference'))}</th></tr></thead><tbody>` +
      A.map((a, i) => {
        const b = B[i];
        if (a.sec) return `<tr class="sec"><td colspan="6">${++n}. ${a.label}</td></tr>`;
        return `<tr class="${a.tot ? 'tot' : ''}"><td>${a.label}</td><td>${fmt(a.v)}</td><td class="pct">${a.note}</td>` +
          `<td>${fmt(b.v)}</td><td class="pct">${b.note}</td><td class="diff">${signed(b.v - a.v)}</td></tr>`;
      }).join('') + '</tbody>';
    $('calcNotes').innerHTML = [r1, r2].filter((r, i) => i === 0 || r !== r1).map(r =>
      `<div><h3>${name(r)}</h3><ul>${notesOf(r.country).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');
  }

  form.addEventListener('input', update);
  $('reset').addEventListener('click', () => { inputs = { ...DEFAULTS }; fillForm(); update(); });
  form.addEventListener('submit', e => e.preventDefault());
  update();
})();
</script>
</body>
</html>
